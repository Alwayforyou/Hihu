<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe5f0">
<title>🎂 Ada kejutan buat kamu!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:20px;overflow:hidden;background:linear-gradient(145deg,#ffe3ef,#e8e2ff 55%,#d8f7f0);color:#49334c}
.card{width:min(100%,480px);padding:30px 22px;text-align:center;border:1px solid #fff9;border-radius:30px;background:#ffffffdf;box-shadow:0 24px 70px #7b568b30;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.cake{font-size:86px;animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-9px) rotate(4deg)}}
h1{font-size:clamp(30px,8vw,43px);line-height:1.08;margin:12px 0;color:#a34f83}
p{line-height:1.55;color:#735e78}
button{border:0;border-radius:999px;padding:16px 23px;background:linear-gradient(90deg,#ff83b7,#bd9aff);color:#fff;font-weight:850;font-size:16px;box-shadow:0 9px 25px #bd82c955;cursor:pointer;min-height:52px}
.tiny{font-size:12px;opacity:.7;margin-top:18px}
#horror{display:none;position:fixed;inset:0;background:#000;z-index:5;place-items:center;overflow:hidden}
#horror.show{display:grid;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#scareImage{display:block;position:absolute;width:100%;height:100%;object-fit:contain;object-position:center;animation:creep 1.8s ease-in-out infinite alternate}
@keyframes creep{from{transform:scale(.86)}to{transform:scale(1.16)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 28%,#0008 100%);pointer-events:none}
.scareText{position:absolute;z-index:2;bottom:max(28px,env(safe-area-inset-bottom));left:10px;right:10px;text-align:center;font-weight:950;letter-spacing:.04em;font-size:clamp(22px,7vw,38px);color:#fff;text-shadow:0 3px 18px #f00;line-height:1.2}
</style>
</head>
<body>
<main class="card" id="intro">
  <div class="cake">🎂🎈</div>
  <h1>Selamat Ulang Tahun! 💖</h1>
  <p>Semoga hari ini penuh tawa, hadiah, dan kejutan manis buat kamu!</p>
  <p>Aku punya satu hadiah spesial… siap buka?</p>
  <button id="open" type="button">🎁 BUKA HADIAH</button>
  <div class="tiny">dibuat khusus untuk hari spesialmu ✨</div>
</main>

<section id="horror" aria-label="Kejutan prank">
  <img id="scareImage" src="./assets/prank-face.jpg" alt="Kejutan jumpscare">
  <div class="shade"></div>
  <div class="scareText">SELAMAT KENA PRANK<br>BY NINGNING 😈</div>
</section>

<audio id="scareSound" src="./assets/scare-sound.mp3" preload="auto" loop></audio>

<script>
const intro = document.getElementById('intro');
const horror = document.getElementById('horror');
const sound = document.getElementById('scareSound');

document.getElementById('open').addEventListener('click', async () => {
  intro.style.display = 'none';
  horror.classList.add('show');

  // Start sound directly from the user's button interaction.
  sound.loop = true;
  sound.volume = 1;
  sound.currentTime = 0;
  try {
    await sound.play();
  } catch (error) {
    // If the browser/device blocks playback, the visual prank still appears.
    console.warn('Browser tidak mengizinkan pemutaran audio:', error);
  }
});
</script>
</body>
</html>
