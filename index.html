<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6">
<title>🎂 Ada kejutan buat kamu!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff 0 3%,transparent 4%),linear-gradient(145deg,#ffe3ef,#e8e2ff 55%,#d8f7f0);color:#49334c}
.card{width:min(100%,480px);padding:30px 22px;text-align:center;border:1px solid #fff9;border-radius:30px;background:#ffffffbd;box-shadow:0 24px 70px #7b568b30;backdrop-filter:blur(10px);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.cake{font-size:86px;filter:drop-shadow(0 10px 12px #c77b9b33);animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-9px) rotate(4deg)}}
h1{font-size:clamp(30px,8vw,43px);line-height:1.08;margin:12px 0;color:#a34f83}
p{line-height:1.55;color:#735e78}
button{border:0;border-radius:999px;padding:16px 23px;background:linear-gradient(90deg,#ff83b7,#bd9aff);color:#fff;font-weight:850;font-size:16px;box-shadow:0 9px 25px #bd82c955;cursor:pointer;min-height:52px}
button:active{transform:scale(.97)}
.tiny{font-size:12px;opacity:.7;margin-top:18px}
#horror{display:none;position:fixed;inset:0;background:#000;z-index:5;color:white;place-items:center;overflow:hidden}
#horror.show{display:grid;animation:darkin .45s ease}
@keyframes darkin{from{opacity:0}to{opacity:1}}
#scareImage{position:absolute;width:100%;height:100%;object-fit:contain;filter:contrast(1.12) brightness(.85);animation:creep 2.2s ease-in-out infinite alternate}
@keyframes creep{from{transform:scale(.83)}to{transform:scale(1.16)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,#000b 100%);pointer-events:none}
.scareText{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;font-weight:950;letter-spacing:.08em;font-size:clamp(22px,7vw,38px);color:#fff;text-shadow:0 3px 18px #f00;line-height:1.15}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="card" id="intro">
 <div class="cake">🎂🎈</div>
 <h1>Selamat Ulang Tahun! 💖</h1>
 <p>Semoga hari ini penuh tawa, hadiah, dan kejutan manis buat kamu!</p>
 <p>Aku punya satu hadiah spesial… siap buka?</p>
 <button id="open">🎁 BUKA HADIAH</button>
 <div class="tiny">dibuat khusus untuk hari spesialmu ✨</div>
</main>
<section id="horror" aria-label="Kejutan horor kartun">
 <img id="scareImage" src="assets/jumpscare.jpg" alt="Gambar kejutan horor">
 <div class="shade"></div>
 <div class="scareText">SELAMAT KENA PRANK<br>BY NINGNING 😈</div>
</section>
<audio id="scareSound" src="assets/jumpscare.mp3" preload="auto" loop></audio>
<script>
const intro=document.getElementById('intro');
const horror=document.getElementById('horror');
const sound=document.getElementById('scareSound');
let started=false;
document.getElementById('open').addEventListener('click',async()=>{
 if(started)return;
 started=true;
 intro.style.display='none';
 horror.classList.add('show');
 try{
   sound.currentTime=0;
   await sound.play();
 }catch(e){
   // Beberapa browser tetap dapat menolak audio; tidak ada kontrol suara yang ditampilkan.
 }
});
</script>
</body></html>
